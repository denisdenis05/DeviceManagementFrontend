<div class="authentication-container">
  <div class="authentication-card">
    <h2>Register</h2>
    <form [formGroup]="registerForm" (ngSubmit)="submitRegistration()">
      <div class="form-group">
        <label for="emailInput">Email</label>
        <input 
          id="emailInput" 
          type="email" 
          formControlName="email" 
          placeholder="Enter email address" />
        <div 
          class="validation-error" 
          *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          <span *ngIf="registerForm.get('email')?.hasError('required')">
            {{ validationMessages.RequiredField }}
          </span>
          <span *ngIf="registerForm.get('email')?.hasError('email')">
            {{ validationMessages.InvalidEmailFormat }}
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input 
          id="passwordInput" 
          type="password" 
          formControlName="password" 
          placeholder="Enter password" />
        <div 
          class="validation-error" 
          *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          <span *ngIf="registerForm.get('password')?.hasError('required')">
            {{ validationMessages.RequiredField }}
          </span>
          <span *ngIf="registerForm.get('password')?.hasError('minlength')">
            {{ validationMessages.PasswordMinimumLengthError }}
          </span>
        </div>
      </div>

      <button type="submit" class="primary-button" [disabled]="registerForm.invalid">
        Register Account
      </button>
      
      <button type="button" class="secondary-button" (click)="navigateToLogin()">
        Return to Login
      </button>
    </form>
  </div>
</div>
