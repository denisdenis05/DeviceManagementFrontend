<div class="authentication-container">
  <div class="authentication-card">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <div class="form-group">
        <label for="emailInput">Email</label>
        <input 
          id="emailInput" 
          type="email" 
          formControlName="email" 
          placeholder="Enter email address" />
        <div 
          class="validation-error" 
          *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <span *ngIf="loginForm.get('email')?.hasError('required')">
            {{ validationMessages.RequiredField }}
          </span>
          <span *ngIf="loginForm.get('email')?.hasError('email')">
            {{ validationMessages.InvalidEmailFormat }}
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input 
          id="passwordInput" 
          type="password" 
          formControlName="password" 
          placeholder="Enter password" />
        <div 
          class="validation-error" 
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.hasError('required')">
            {{ validationMessages.RequiredField }}
          </span>
        </div>
      </div>

      <button type="submit" class="primary-button" [disabled]="loginForm.invalid">
        Secure Login
      </button>
      
      <button type="button" class="secondary-button" (click)="navigateToRegister()">
        Create New Account
      </button>
    </form>
  </div>
</div>
