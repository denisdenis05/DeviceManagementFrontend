<div class="mini-chat-wrapper" [class.open]="isOpen">
  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen">
    <div class="chat-header">
      <h3>Device Assistant</h3>
      <button class="close-chat" (click)="toggleChat()">✖</button>
    </div>

    <div class="chat-messages" #scrollContainer>
      <div *ngFor="let msg of messages" class="message-bubble" [class.user-message]="msg.isUser">
        <div class="message-text">{{ msg.text }}</div>

        <div class="device-cards-container" *ngIf="msg.devices && msg.devices.length > 0">
          <div *ngFor="let device of msg.devices" class="simplified-device-card">
            <div class="device-header">
              <a [routerLink]="['/details', device.id]" class="device-name" (click)="toggleChat()">{{ device.name }}</a>
            </div>
            <div class="device-info">
              <span class="assigned-to">
                Assigned to:
                <ng-container *ngIf="device.assignedUserId">
                  {{ device.assignedUserId === currentUserId ? 'You' : device.assignedUserEmail }}
                </ng-container>
                <ng-container *ngIf="!device.assignedUserId">Unassigned</ng-container>
              </span>
            </div>
            <div class="device-actions">
              <a [routerLink]="['/details', device.id]" class="mini-button info" (click)="toggleChat()">Details</a>
              <a [routerLink]="['/edit', device.id]" class="mini-button warning" (click)="toggleChat()">Edit</a>
              <button class="mini-button danger" (click)="deleteDevice(device.id)">Delete</button>

              <button class="mini-button success" *ngIf="!device.assignedUserId"
                (click)="assignDevice(device.id)">Assign</button>
              <button class="mini-button warning" *ngIf="device.assignedUserId === currentUserId"
                (click)="unassignDevice(device.id)">Unassign</button>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="isLoading" class="message-bubble loading-bubble">
        <div class="dot-typing"></div>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Ask about devices..."
        [disabled]="isLoading" />
      <button (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">Send</button>
    </div>
  </div>
</div>
