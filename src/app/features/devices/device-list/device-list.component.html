<div class="device-list-container">
  <div class="header-section">
    <h1 class="header-title">All Devices</h1>
    <button class="action-button success-button" (click)="navigateToCreate()">Create New Device</button>
  </div>

  <div class="table-responsive">
    <table class="devices-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Manufacturer</th>
          <th>Type</th>
          <th>Operating System</th>
          <th>Assigned User</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let device of devicesList">
          <td>{{ device.name }}</td>
          <td>{{ device.manufacturer }}</td>
          <td>{{ device.type }}</td>
          <td>{{ device.operatingSystem }} {{ device.osVersion }}</td>
          <td>Unassigned</td>
          <td class="action-columns">
            <button class="action-button info-button" (click)="navigateToDetail(device.id)">View</button>
            <button class="action-button warning-button" (click)="navigateToEdit(device.id)">Edit</button>
            <button class="action-button danger-button" (click)="removeDevice(device.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
